name: source-record-obs-studio
base: core24
version: '0.4.8'
title: Source Record (OBS plugin)
summary: Record any source in OBS Studio
description: |
  Source Record lets you record any source in OBS Studio. This is a filter that
  provides an individual record button for any source, allowing you to record
  sources independently from the main output.
contact: https://github.com/astrojuanlu/source-record-obs-studio-snap
license: GPL-2.0
website: https://github.com/astrojuanlu/source-record-obs-studio-snap
source-code: https://github.com/astrojuanlu/source-record-obs-studio-snap
issues: https://github.com/astrojuanlu/source-record-obs-studio-snap

grade: stable
confinement: strict

platforms:
  amd64:

slots:
  obs-plugins:
    interface: content
    source:
      read:
        - /${CRAFT_PROJECT_NAME}

parts:
  prepare-hook:
    plugin: nil
    override-build: |
      mkdir -p ${CRAFT_PART_INSTALL}/snap/hooks/
      echo -e '#!/bin/bash\nsnapctl set :obs-plugins snapname='"${CRAFT_PROJECT_NAME}" > ${CRAFT_PART_INSTALL}/snap/hooks/prepare-slot-obs-plugins

  source-record:
    source: https://github.com/exeldro/obs-source-record.git
    source-type: git
    source-tag: 0.4.8
    plugin: cmake
    build-environment:
      - CMAKE_PREFIX_PATH: "/snap/obs-studio/current/usr/"
    cmake-parameters:
      - -DBUILD_OUT_OF_TREE=On
      - -DCMAKE_INSTALL_PREFIX=/usr
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_C_FLAGS=-Wno-deprecated-declarations
      - -DLINUX_PORTABLE=OFF
      - -G Ninja
    build-packages:
      - libsimde-dev
      - ninja-build
    build-snaps:
      - obs-studio/latest/stable
    organize:
      usr/lib/obs-plugins/source-record.so: ${CRAFT_PROJECT_NAME}/plugins/source-record.so
      usr/share/obs/obs-plugins/source-record: ${CRAFT_PROJECT_NAME}/data
    prime:
      - -usr/lib/*/obs-plugins
      - -usr/obs-plugins
      - -usr/data
